name: Apps verwalten
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Was möchtest du machen?
        type: choice
        options: [Hinzufügen / Aktualisieren, Löschen, Gültigkeit erneuern, Alle Updates prüfen, Downloads freigeben, Downloads sperren]
        required: true
      repository:
        description: GitHub-Link der App (nur für Hinzufügen / Aktualisieren)
        type: string
      category:
        description: Kategorie
        type: choice
        options: [Spiele, Tools, Editoren]
        default: Tools
      app_id:
        description: App-ID für Löschen oder Downloadfreigabe (steht im letzten Ergebnis)
        type: string
      description:
        description: Eigene Beschreibung (leer = von GitHub übernehmen)
        type: string
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: owner-catalog
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor_id == '64050987' && github.repository == 'hahawasistlos1/Jir3n-App-Hub' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: github.event_name == 'schedule' || inputs.operation == 'Hinzufügen / Aktualisieren' || inputs.operation == 'Alle Updates prüfen'
        with:
          distribution: temurin
          java-version: '17'
      - name: APK-Prüfprogramme bereitstellen
        if: github.event_name == 'schedule' || inputs.operation == 'Hinzufügen / Aktualisieren' || inputs.operation == 'Alle Updates prüfen'
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$tools/aapt"
          test -x "$tools/apksigner"
          echo "AAPT=$tools/aapt" >> "$GITHUB_ENV"
          echo "APKSIGNER=$tools/apksigner" >> "$GITHUB_ENV"
      - name: Abhängigkeit installieren
        run: python -m pip install 'cryptography>=44,<47'
      - name: Eigentümer prüfen und Katalog veröffentlichen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_PRIVATE_KEY: ${{ secrets.CATALOG_PRIVATE_KEY }}
        run: python tools/catalog_admin.py
